name: Deploy multi-arch (AMD64 and ARM64) as one image to Dockerhub
# TODO: multiarch
on:
  push:
    branches:
      # - master
      - feat/split_concerns

env:
  IMAGE_NAME: oracle-oci-k8s-all-in-one
  DOCKERHUB_USER: miriha

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-24.04 # https://github.com/actions/runner-images?tab=readme-ov-file#available-images    
    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Debug env
      run: |
        echo $DOCKER_REGISTRY/$CONTAINER_NAME/$GITHUB_RUN_ID
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        platforms: linux/amd64 # ,linux/arm64
        context: .
        file: docker/Dockerfile.aio
        push: true
        tags: ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest
        # labels: ${{ steps.meta.outputs.labels }}
        # provenance: false
        # sbom: false