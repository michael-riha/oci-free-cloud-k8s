services:
  aio:
    build: 
      context: ./docker
      dockerfile: Dockerfile.aio
    image: terraform-oci-kubectl-kubeseal:0.1
    # public 
    # image: miriha/oracle-oci-k8s-all-in-one:latest
    entrypoint: tail -f /dev/null
    volumes:
      - ./credentials/.oci:/root/.oci
      - ./credentials/.kube:/root/.kube
      - ./terraform/infra:/workspace/oci-infra
      # for services deployment and `kubeseal`
      - ./credentials/argo-ssh:/workspace/argo-ssh
      # TODO: make this even more modular!
      - ./k8s-default-resources:/workspace/k8s-default-resources
    ports:
      - 8080:8080 # for argoCD portforwarding
      - 8181:8181 # for oci authentication portforwarding
    working_dir: /workspace
    environment:
      - OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
    #   - KUBECONFIG=~/.kube/free-k8s-config
  postfix:
    build: 
      context: ./docker
      dockerfile: Dockerfile.postfix
    image: terraform-oci-postfix-relay:0.1
    entrypoint: tail -f /dev/null # 
    # entrypoint: ./entrypoint.sh postfix start-fg
    dns: 
    # use public DNS to resolve the relay host
      - 8.8.8.8
      - 1.1.1.1
    # # Fallback option use host network - container shares host's network stack
    # network_mode: "host"
    env_file:
      - ./docker/postfix.env
    # environment:
    #   # Optional: override config file values
    #   - HOSTNAME=postfix-relay
    #   - DOMAIN=localdomain
    #   - RELAY_HOST=
    #   - RELAY_PORT=
    #   - SMTP_USER=
    #   - SMTP_PASSWORD=
    volumes:
        # Mount your config directory
      - ./docker/postfix-service/main.cf.template:/main.cf.template
      - ./docker/postfix-service/entrypoint.sh:/entrypoint.sh
    ports:
      - 25:25
      # - 587:587
    profiles:
      - postfix
